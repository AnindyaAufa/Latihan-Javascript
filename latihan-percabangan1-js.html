<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Soal 1 - Percabangan</title>
</head>
<body>

    <h2>Program Pengecekan Nilai Siswa</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya ya.</p>

    <script>
        function cekKelulusan(nilaiSiswa) {
            // Batas lulus minimal 75
            if (nilaiSiswa >= 75) {
                console.log("Nilai kamu " + nilaiSiswa + ", statusnya: Lulus!");
            } else {
                console.log("Nilai kamu " + nilaiSiswa + ", statusnya: Remedial.");
            }
        }

        
        cekKelulusan(85);
        cekKelulusan(60);
        cekKelulusan(75);
    </script>

</body>
</html>
