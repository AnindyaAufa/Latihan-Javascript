<!DOCTYPE html>
<html lang="id"> 
<head>
    <meta charset="UTF-8">
    <title>Latihan Soal 2 - Perulangan</title>
</head>
<body>

    <h2>Hitung Mundur (Countdown)</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya ya.</p>

    <script>
        // Perulangan dengan while
        let j = 3;
        while (j >= 1) {
            console.log(j);
            j--;
        }
        console.log("Start!");
    </script>

</body>
</html>
