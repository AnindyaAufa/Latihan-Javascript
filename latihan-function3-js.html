<!DOCTYPE html> 
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Soal 3 - Function</title>
</head>
<body>

    <h2>Balik String</h2>
    <p>Silakan buka <strong>Inspect Element -> Console</strong> untuk melihat hasilnya ya.</p>

    <script>
        // Function untuk membalik string
        function balikString(str) {
            return str.split("").reverse().join("");
        }

        // Memanggil function
        console.log(balikString("JavaScript")); // Output: tpircSavaJ
        console.log(balikString("Hello")); // Output: olleH
    </script>

</body>
</html>
